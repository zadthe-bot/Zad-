name: Build Customer App (Android)

on:
  push:
    branches: [main]
    paths:
      - 'Customer/**'
  workflow_dispatch: {}

jobs:
  build:
    name: Build signed APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Customer

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # --- Decode the release keystore from secrets ---
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB (for Play Store)
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-apk
          path: Customer/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: customer-release-aab
          path: Customer/build/app/outputs/bundle/release/app-release.aab
